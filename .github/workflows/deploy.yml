name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to IONOS Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH and Execute Deployment Script
        env:
          SSH_PRIVATE_KEY: ${{ secrets.IONOS_SSH_KEY }}
          SSH_HOST: access932199769.webspace-data.io
          SSH_USER: u109510944
          SSH_PORT: "22"
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Strict host key verification using known_hosts
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Normalize private key format (handles actual newlines, literal \n, and CRLF)
          KEY_DATA="$SSH_PRIVATE_KEY"
          if [[ "$KEY_DATA" == *'\n'* ]]; then
            KEY_DATA=$(printf '%b' "$KEY_DATA")
          fi

          printf '%s\n' "$KEY_DATA" | tr -d '\r' > ~/.ssh/ionos_deploy_key
          chmod 600 ~/.ssh/ionos_deploy_key

          # Verify key structure and print key fingerprint to logs
          ssh-keygen -l -f ~/.ssh/ionos_deploy_key

          # Start ssh-agent and register the ED25519 key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/ionos_deploy_key

          # Execute the production deployment script
          ssh -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/ionos_deploy_key \
              "$SSH_USER@$SSH_HOST" "bash /kunden/homepages/30/d932199769/htdocs/deploy-siyaskitchen.sh"

          # Clean up
          ssh-agent -k || true
          rm -f ~/.ssh/ionos_deploy_key
