name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to IONOS Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH and Execute Deployment Script
        env:
          SSH_HOST: access932199769.webspace-data.io
          SSH_USER: u109510944
          SSH_PORT: "22"
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Strict host key verification using known_hosts
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Decode Base64 private key into dedicated key file with 600 permissions
          printf '%s' "${{ secrets.IONOS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/ionos_deploy_key
          chmod 600 ~/.ssh/ionos_deploy_key

          # Execute the production deployment script
          ssh -i ~/.ssh/ionos_deploy_key \
              -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" "bash /kunden/homepages/30/d932199769/htdocs/deploy-siyaskitchen.sh"

          # Clean up temporary private key
          rm -f ~/.ssh/ionos_deploy_key
