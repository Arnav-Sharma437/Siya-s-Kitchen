name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to IONOS Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH and Execute Deployment Script
        env:
          SSH_PRIVATE_KEY: ${{ secrets.IONOS_SSH_KEY }}
          SSH_HOST: access932199769.webspace-data.io
          SSH_USER: u109510944
          SSH_PORT: "22"
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Strict host key verification using known_hosts
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Write key cleanly, strip any Windows carriage returns, ensure trailing newline
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/ionos_deploy_key
          chmod 600 ~/.ssh/ionos_deploy_key

          # Check if secret looks like a public key rather than a private key
          FIRST_LINE=$(head -n 1 ~/.ssh/ionos_deploy_key | awk '{print $1}')
          if [[ "$FIRST_LINE" == "ssh-ed25519" || "$FIRST_LINE" == "ssh-rsa" ]]; then
            echo "::error::The secret IONOS_SSH_KEY contains a PUBLIC key ($FIRST_LINE), but SSH deployment requires the matching PRIVATE key (starting with -----BEGIN OPENSSH PRIVATE KEY-----)."
            exit 1
          fi

          # Execute the production deployment script
          ssh -i ~/.ssh/ionos_deploy_key \
              -p "$SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" "bash /kunden/homepages/30/d932199769/htdocs/deploy-siyaskitchen.sh"

          # Clean up temporary private key
          rm -f ~/.ssh/ionos_deploy_key
