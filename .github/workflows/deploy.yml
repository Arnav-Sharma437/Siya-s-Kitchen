name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to IONOS Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH and Execute Deployment Script
        env:
          SSH_PRIVATE_KEY: ${{ secrets.IONOS_SSH_KEY }}
          SSH_HOST: access932199769.webspace-data.io
          SSH_USER: u109510944
          SSH_PORT: "22"
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Strict host key verification using known_hosts
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Clean Windows CRLF line endings, ensure trailing newline, and set permissions
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Execute the production deployment script with key compatibility flags
          ssh -i ~/.ssh/id_rsa \
              -p "$SSH_PORT" \
              -o PubkeyAcceptedKeyTypes=+ssh-rsa \
              -o HostkeyAlgorithms=+ssh-rsa \
              "$SSH_USER@$SSH_HOST" "bash /kunden/homepages/30/d932199769/htdocs/deploy-siyaskitchen.sh"

          # Clean up private key
          rm -f ~/.ssh/id_rsa
